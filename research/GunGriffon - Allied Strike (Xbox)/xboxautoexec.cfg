bind "##keyboard" "##key x" "X"
bind "##keyboard" "##key t" "View"
bind "##keyboard" "##key z" "Zoom"
bind "##keyboard" "##key escape" "Quit"
bind "##keyboard" "##key F1" "DEBUG01"
bind "##keyboard" "##key F2" "DEBUG02"
bind "##keyboard" "##key F3" "DEBUG03"

