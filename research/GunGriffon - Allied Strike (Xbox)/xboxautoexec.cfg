AddAction MoveForward 1
AddAction MoveBackward 2
AddAction MoveLeft 3
AddAction MoveRight 4
AddAction XAxisMove 5
AddAction YAxisMove 6
AddAction XAxisLook 7
AddAction YAxisLook 8
AddAction Fire 11
AddAction NextWeapon 12
AddAction Jump 13
AddAction RollerDash 14
AddAction ChangeMagazine 15
AddAction X 16
AddAction View 17
AddAction Zoom 18
AddAction NpcCommandOn 19
AddAction NpcCommandOff 20
AddAction Start 31
AddAction Back 32
AddAction Up 33
AddAction Down 34
AddAction Left 35
AddAction Right 36
AddAction DEBUG01 61  	
AddAction DEBUG02 62
AddAction DEBUG03 63
AddAction Quit 250


enabledevice "##keyboard" 1
bind "##keyboard" "##key up" "Up"
bind "##keyboard" "##key left" "Down"
